function timeUntil(iso) {

    const ago = -ms;
    const h = Math.floor(ago/3600000), m = Math.floor((ago%3600000)/60000);
    if (h >= 3) return `🔴 fini`;
    if (h >= 1) return `🔴 LIVE +${h}h${m}`;
    return `🔴 LIVE +${m}min`;
  }
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  if (h >= 24) return `dans ${Math.floor(h/24)}j ${h%24}h`;
  if (h >= 1)  return `dans ${h}h ${m}min`;
  return `dans ${m}min`;
}

/* ====== API CLIENT ====== */
async function fetchOddsCached(sportKey, apiKey) {
  const cached = state.oddsCache.get(sportKey);
  if (cached && (Date.now() - cached.ts) < state.cacheMs) {
    return { events: cached.events, fromCache: true };
  }
  const url = `https://api.the-odds-api.com/v4/sports/${sportKey}/odds/` +
    `?apiKey=${encodeURIComponent(apiKey)}&regions=eu&markets=${MARKETS.join(",")}` +
    `&bookmakers=${FRENCH_BOOKMAKERS.join(",")}&oddsFormat=decimal`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${sportKey} -> HTTP ${r.status}`);
  const remaining = r.headers.get("x-requests-remaining");
  const used = r.headers.get("x-requests-used");
  if (remaining !== null) state.quotaRemaining = Number(remaining);
  if (used !== null) state.quotaUsed = Number(used);
  const events = await r.json();
  state.oddsCache.set(sportKey, { ts: Date.now(), events });
  return { events, fromCache: false };
}

/* ====== ARB + VALUE LOGIC ====== */
function bestOddsForMarket(bookmakers, marketKey) {
  const best = {}, books = {}, bookKeys = {}, allOdds = {}, allLines = {};
  let bookCount = 0;
  for (const b of bookmakers) {
    const m = b.markets && b.markets.find(x => x.key === marketKey);
    if (!m) continue;
    bookCount++;
    for (const o of m.outcomes) {
      const key = o.point !== undefined ? `${o.name} ${o.point}` : o.name;
      if (o.point !== undefined) (allLines[o.name] = allLines[o.name] || []).push(o.point);
      if (!best[key] || o.price > best[key]) {
        best[key] = o.price;
        books[key] = BOOK_LABELS[b.key] || b.title;
        bookKeys[key] = b.key;
      }
      (allOdds[key] = allOdds[key] || []).push(o.price);
    }
  }
  return { best, books, bookKeys, allOdds, allLines, bookCount };
}

function computeFairOdds(allOdds) {
  const outcomes = Object.keys(allOdds);
  if (outcomes.length < 2) return {};
  const avg = {};
  for (const k of outcomes) avg[k] = allOdds[k].reduce((a,b)=>a+b,0) / allOdds[k].length;
  const margin = outcomes.reduce((s,k)=>s + 1/avg[k], 0);
  const fair = {};
  for (const k of outcomes) fair[k] = avg[k] * margin;
  return fair;
}

// Variance des lignes O/U entre books — clé pour la confiance
function lineConsensus(allLines) {
  const out = {};
  for (const [name, lines] of Object.entries(allLines)) {
    if (!lines.length) continue;
    const min = Math.min(...lines);
    const max = Math.max(...lines);
    const avg = lines.reduce((a,b)=>a+b,0) / lines.length;
    out[name] = { min, max, avg: r2(avg), variance: r2(max - min), count: lines.length };
  }
  return out;
}

/**
 * Score de confiance 1-10 par opportunité.
 * Combine 4 signaux objectifs : couverture books, variance ligne O/U,
 * temps avant match, magnitude de l'edge (trop fort = suspect).
 */
function computeConfidence(opp) {
  let score = 5;

  // Couverture books (4/4 = très fiable)
  if (opp.book_count === 4)      score += 2;
  else if (opp.book_count === 3) score += 1;
  else                            score -= 1;

  // Variance ligne O/U (uniquement pour totals)
  if (opp.market === "totals") {
    const variances = Object.values(opp.line_consensus || {}).map(c => c.variance);
    const maxVar = variances.length ? Math.max(...variances) : 0;
    if (maxVar === 0)      score += 2;     // toutes les lignes identiques
    else if (maxVar <= 0.5) score += 1;
    else if (maxVar <= 1.5) score += 0;
    else if (maxVar <= 3)   score -= 1;
    else                    score -= 3;     // > 3 pts d'écart : très suspect
  }

  // Temps avant kickoff
  const hoursToStart = (new Date(opp.start_time) - Date.now()) / 3600000;
  if (hoursToStart > 24)      score += 1;
  else if (hoursToStart > 6)  score += 0;
  else if (hoursToStart > 1)  score -= 1;
  else if (hoursToStart > 0)  score -= 2;
  else                         score -= 3;   // déjà commencé

  // Magnitude de l'edge (trop = bug ou cote stale)
  if (opp.arb_pct > 10)      score -= 4;
  else if (opp.arb_pct > 6)  score -= 2;
  else if (opp.arb_pct > 3)  score += 1;

  return Math.max(1, Math.min(10, Math.round(score)));
}

function processEvent(ev, sport) {
  const fb = ev.bookmakers.filter(b => FRENCH_BOOKMAKERS.includes(b.key));
  if (fb.length < 2) return [];
  const results = [];
  for (const market of MARKETS) {
    const { best, books, bookKeys, allOdds, allLines, bookCount } = bestOddsForMarket(fb, market);
    if (Object.keys(best).length < 2) continue;
    const sum = Object.values(best).reduce((a,o)=>a+1/o, 0);
    const arb = (1 - sum) * 100;
    const fair = computeFairOdds(allOdds);
    const lineCons = lineConsensus(allLines);
    const liq = bookCount / FRENCH_BOOKMAKERS.length;
    const oddsR = {}; for (const [k,v] of Object.entries(best)) oddsR[k] = r2(v);
    const fairR = {}; for (const [k,v] of Object.entries(fair)) fairR[k] = r2(v);
    const edges = {};
    for (const k of Object.keys(best)) if (fair[k]) edges[k] = r2((best[k]/fair[k] - 1) * 100);
    const maxEdge = Object.values(edges).length ? Math.max(...Object.values(edges)) : 0;
    const score = arb*0.6 + sport.priority*2.5 + liq*1.5;

    const opp = {
      id: `${ev.id || (ev.home_team+ev.away_team)}|${market}|${ev.commence_time}`,
      raw_event_id: ev.id,
      event: `${ev.home_team} vs ${ev.away_team}`,
      sport: sport.label, sport_key: sport.key, sport_emoji: sport.emoji,
      sport_research: sport.research,
      market, market_label: market === "h2h" ? "1N2 / Vainqueur" : "Total points (O/U)",
      start_time: ev.commence_time,
      best_odds: oddsR, fair_odds: fairR, edges,
      max_edge: r2(maxEdge),
      books, book_keys: bookKeys,
      arb_pct: r2(arb),
      value_score: r2(score),
      book_count: bookCount,
      line_consensus: lineCons,
      home_team: ev.home_team, away_team: ev.away_team,
    };
    opp.confidence = computeConfidence(opp);
    results.push(opp);
  }
  return results;
}

async function getTopOpportunities(apiKey) {
  // Pause manuelle (cooldown money management)
  if (state.pausedUntil > Date.now()) {
    const minLeft = Math.ceil((state.pausedUntil - Date.now()) / 60000);
    state.warning = `⏸ Cooldown actif (${minLeft} min restantes). Reprends ton souffle, le marché ne va nulle part.`;
    return { arbs: [], values: [] };
  }
  // Pause auto si quota bas
  if (state.quotaRemaining !== null && state.quotaRemaining < state.apiPauseAt) {
    state.warning = `⏸ Quota API bas (${state.quotaRemaining} restants < seuil ${state.apiPauseAt}). Scan en pause auto.`;
    return { arbs: [], values: [] };
  }
  state.warning = null;
  const enabled = SPORTS.filter(s => state.enabledSports[s.key]);
  if (!enabled.length) return { arbs: [], values: [] };
  const res = await Promise.allSettled(
    enabled.map(s => fetchOddsCached(s.key, apiKey).then(r => ({ sport: s, ...r })))
  );
  const arbs = [], values = [];
  let totalEvents = 0; const errors = [];
  for (const r of res) {
    if (r.status !== "fulfilled") { errors.push(r.reason?.message || "err"); continue; }
    totalEvents += (r.value.events || []).length;
    for (const ev of (r.value.events || [])) {
      // Filtre fenêtre temporelle
      if (state.scanWindowMin > 0) {
        const minToStart = (new Date(ev.commence_time) - Date.now()) / 60000;
        if (minToStart > state.scanWindowMin) continue;
      }
      const opps = processEvent(ev, r.value.sport);
      for (const o of opps) {
        if (state.hidden[o.id]) continue;
        if (o.confidence < state.minConfidence) continue;
        // Filtre marché (h2h / totals / all)
        if (state.marketFilter !== "all" && o.market !== state.marketFilter) continue;
        // Filtre tranche de cote : toutes les jambes doivent être dans [minOdds, maxOdds]
        const oddsValues = Object.values(o.best_odds);
        const minO = Math.min(...oddsValues);
        const maxO = Math.max(...oddsValues);
        if (minO < state.minOdds || maxO > state.maxOdds) continue;
        if (state.showArbs       && o.arb_pct  >= MIN_ARB_PCT)  arbs.push(o);
        if (state.showValueBets  && o.max_edge >= state.valueEdge) values.push(o);
      }
    }
  }
  state.rawCount = totalEvents;
  // Filtrage des erreurs "hors-saison" (HTTP 422) qui ne sont pas vraiment des erreurs
  const realErrors = errors.filter(e => !/422|UNKNOWN_SPORT|Sport not found/i.test(e));
  if (realErrors.length === enabled.length) throw new Error("Toutes les requêtes ont échoué : " + realErrors[0]);
  if (realErrors.length > 0 && realErrors.length < enabled.length) {
    state.warning = `${realErrors.length} sport(s) en erreur, ${enabled.length - realErrors.length} OK. Les sports hors-saison sont ignorés silencieusement.`;
  }

  const sortFn = {
    confidence: (a,b)=>b.confidence-a.confidence || b.value_score-a.value_score,
    value_score:(a,b)=>b.value_score-a.value_score,
    arb_pct:    (a,b)=>b.arb_pct-a.arb_pct,
    start_time: (a,b)=>new Date(a.start_time)-new Date(b.start_time),
    sport:      (a,b)=>a.sport.localeCompare(b.sport) || b.value_score-a.value_score,
    edge:       (a,b)=>b.max_edge-a.max_edge,
  }[state.sortBy] || ((a,b)=>b.confidence-a.confidence);

  return {
    arbs: arbs.sort(sortFn).slice(0, TOP_N),
    values: values.sort((a,b)=>b.confidence-a.confidence || b.max_edge - a.max_edge).slice(0, TOP_N),
  };
}

function calculateStakes(odds, total=100) {
  const sum = Object.values(odds).reduce((a,o)=>a+1/o, 0);
  const stakes = {};
  for (const [k,v] of Object.entries(odds)) stakes[k] = r2((total/v)/sum * 100);
  const f = Object.keys(odds)[0];
  const profit = r2(stakes[f] * odds[f] - total);
  const roi = r2(profit/total * 100);
  return { stakes, profit, roi };
}

function kellyStake(odds, fairOdds, bankroll, fraction=0.25) {
  if (!fairOdds || fairOdds <= 1) return 0;
  const b = odds - 1;
  const p = 1 / fairOdds;
  const q = 1 - p;
  const fStar = (b*p - q) / b;
  if (fStar <= 0) return 0;
  return r2(bankroll * fStar * fraction);
}

/* ====== ADAPTIVE SCHEDULER ======
   Calcule la prochaine fréquence de scan en fonction de :
   - Quota API restant (× 1.5 à × 4 si bas)
   - Heure de la journée (× 3 la nuit)
   - Activité récente (× 2 si rien trouvé depuis 3 scans)
   - Onglet visible/caché (× 4 si caché)
*/
function computeAdaptiveDelay() {
  if (!state.adaptiveRefresh) return state.refreshSec;
  const base = state.refreshSec;
  let factor = 1;
  const reasons = [];

  if (state.quotaRemaining !== null) {
    if (state.quotaRemaining < 50)       { factor *= 4;   reasons.push("quota<50 ×4"); }
    else if (state.quotaRemaining < 100) { factor *= 2.5; reasons.push("quota<100 ×2.5"); }
    else if (state.quotaRemaining < 200) { factor *= 1.5; reasons.push("quota<200 ×1.5"); }
  }

  const h = new Date().getHours();
  if (h >= 2 && h < 7)        { factor *= 3;   reasons.push("nuit ×3"); }
  else if (h >= 7 && h < 11)  { factor *= 1.5; reasons.push("matin ×1.5"); }

  if (state.recentEmptyScans >= 3)      { factor *= 2;   reasons.push("inactif ×2"); }
  else if (state.recentEmptyScans >= 5) { factor *= 3;   reasons.push("très inactif ×3"); }

  if (typeof document !== "undefined" && document.hidden) { factor *= 4; reasons.push("onglet caché ×4"); }

  state.lastRefreshFactor = factor;
  state.adaptiveReasons = reasons;
  return Math.round(base * factor);
}

/* ====== MONEY MANAGEMENT ======
   Vérifie qu'un pari respecte les règles :
   - Mise ≤ X% de la bankroll actuelle
   - Pas dépassé le stop-loss journalier
   - Pas en cooldown post-défaites consécutives
*/
function checkMoneyManagement(stake) {
  if (!state.mmEnabled) return { ok: true };

  const stats = computeStats();
  const cur = stats.currentBankroll;
  if (cur <= 0) return { ok: false, reason: "Bankroll épuisée. Reset ou stop." };

  // Mise max
  const maxBet = cur * (state.maxBetPct / 100);
  if (stake > maxBet) {
    return { ok: false, reason: `Mise (${stake}€) > ${state.maxBetPct}% de la bankroll actuelle (${maxBet.toFixed(0)}€). Réduis ou désactive le money management.` };
  }

  // Stop-loss journalier
  const today = todayISO();
  const todayLosses = state.bets
    .filter(b => b.settledAt && b.settledAt.slice(0,10) === today && b.status === "lost")
    .reduce((s,b) => s + b.stake, 0);
  const dailyLimit = cur * (state.dailyLossLimitPct / 100);
  if (todayLosses >= dailyLimit) {
    return { ok: false, reason: `Stop-loss journalier atteint (${todayLosses.toFixed(0)}€ perdus / limite ${dailyLimit.toFixed(0)}€). Reviens demain.` };
  }

  // Cooldown défaites consécutives
  const recentSettled = [...state.bets]
    .filter(b => b.status === "won" || b.status === "lost")
    .sort((a,b) => new Date(b.settledAt||b.date) - new Date(a.settledAt||a.date));
  let consecLosses = 0;
  for (const b of recentSettled) {
    if (b.status === "lost") consecLosses++;
    else break;
  }
  if (consecLosses >= state.cooldownLosses) {
    const cooldownEnd = state.pausedUntil || (Date.now() + state.cooldownMin*60000);
    state.pausedUntil = cooldownEnd;
    save("arb_paused_until", cooldownEnd);
    const minLeft = Math.ceil((cooldownEnd - Date.now()) / 60000);
    return { ok: false, reason: `${consecLosses} défaites consécutives. Cooldown ${minLeft} min activé. Pause forcée pour éviter le tilt.` };
  }

  return { ok: true };
}

/* ====== BET TRACKER ====== */
function addBet(bet, opportunity = null) {
  const stake = Number(bet.stake) || 0;
  const mm = checkMoneyManagement(stake);
  if (!mm.ok) {
    alert("⛔ Money management : " + mm.reason);
    return null;
  }
  const b = {
    id: uid(),
    date: bet.date || new Date().toISOString(),
    sport: bet.sport || "?",
    event: bet.event || "?",
    market: bet.market || "h2h",
    selection: bet.selection || "?",
    book: bet.book || "?",
    odds_at_bet: Number(bet.odds) || 0,
    odds: Number(bet.odds) || 0,
    stake,
    status: "pending",
    type: bet.type || "manual",
    note: bet.note || "",
    confidence: opportunity?.confidence || null,
    opportunity_id: opportunity?.id || null,
    closing_odds: null,
    clv_pct: null,
  };
  state.bets.unshift(b);
  save("arb_bets", state.bets);
  return b;
}

function settleBet(id, status) {
  const b = state.bets.find(x => x.id === id);
  if (!b) return;
  b.status = status;
  b.settledAt = new Date().toISOString();
  if (status === "won")  b.payout = r2(b.stake * b.odds);
  if (status === "lost") b.payout = 0;
  if (status === "push" || status === "void") b.payout = b.stake;
  save("arb_bets", state.bets);
}

function deleteBet(id) {
  state.bets = state.bets.filter(b => b.id !== id);
  save("arb_bets", state.bets);
}

function profitOf(bet) {
  if (bet.status === "pending") return 0;
  if (bet.status === "won")     return r2(bet.stake * (bet.odds - 1));
  if (bet.status === "lost")    return -bet.stake;
  return 0;
}

/* ====== CLV TRACKER ======
   Capture la cote de fermeture pour les paris en attente dont le match
   commence dans < 30 min. Mesure ton skill réel à long terme.
*/
async function captureClosingOdds() {
  if (!state.clvEnabled || !state.apiKey) return;
  const now = Date.now();
  const candidates = state.bets.filter(b =>
    b.status === "pending" &&
    !b.closing_odds &&
    b.opportunity_id &&
    new Date(b.event_start || b.date).getTime() - now < 30*60*1000 &&
    new Date(b.event_start || b.date).getTime() - now > 0
  );
  if (!candidates.length) return;

  // Group by sport_key pour minimiser les appels
  const bySport = {};
  for (const b of candidates) {
    const sportKey = b.sport_key || guessSportKey(b.sport);
    if (!sportKey) continue;
    (bySport[sportKey] = bySport[sportKey] || []).push(b);
  }

  for (const [sportKey, bets] of Object.entries(bySport)) {
    try {
      const { events } = await fetchOddsCached(sportKey, state.apiKey);
      for (const bet of bets) {
        const ev = events.find(e =>
          (e.id && bet.opportunity_id?.includes(e.id)) ||
          `${e.home_team} vs ${e.away_team}` === bet.event
        );
        if (!ev) continue;
        const closing = findClosingOddsFor(ev, bet);
        if (closing) {
          bet.closing_odds = closing;
          bet.clv_pct = r2((bet.odds_at_bet / closing - 1) * 100);
          bet.closing_captured_at = new Date().toISOString();
        }
      }
    } catch (e) { console.warn("[CLV]", e.message); }
  }
  save("arb_bets", state.bets);
}

function findClosingOddsFor(ev, bet) {
  // Cherche la meilleure cote actuelle pour la même sélection
  const fb = ev.bookmakers.filter(b => FRENCH_BOOKMAKERS.includes(b.key));
  let best = 0;
  for (const b of fb) {
    const m = b.markets?.find(x => x.key === bet.market);
    if (!m) continue;
    for (const o of m.outcomes) {
      const key = o.point !== undefined ? `${o.name} ${o.point}` : o.name;
      if (key === bet.selection && o.price > best) best = o.price;
    }
  }
  return best || null;
}

function guessSportKey(label) {
  const s = SPORTS.find(s => s.label === label);
  return s?.key || null;
}

/* ====== STATS ENGINE ====== */
function computeStats() {
  const bets = state.bets;
  const settled = bets.filter(b => b.status !== "pending");
  const won = settled.filter(b => b.status === "won").length;
  const lost = settled.filter(b => b.status === "lost").length;
  const totalStake = settled.reduce((s,b)=>s+b.stake, 0);
  const totalProfit = settled.reduce((s,b)=>s+profitOf(b), 0);
  const winRate = settled.length ? won / settled.length * 100 : 0;
  const yieldPct = totalStake ? totalProfit / totalStake * 100 : 0;
  const roi = state.bankroll ? totalProfit / state.bankroll * 100 : 0;
  const currentBankroll = state.bankroll + totalProfit;

  // Bankroll cumulée
  const sortedSettled = [...settled].sort((a,b)=>new Date(a.settledAt) - new Date(b.settledAt));
  let bk = state.bankroll;
  const bankrollSeries = [{ x: null, y: bk }];
  for (const b of sortedSettled) {
    bk += profitOf(b);
    bankrollSeries.push({ x: b.settledAt, y: r2(bk) });
  }

  // Streak
  let curStreak = 0, curType = null, longestWin = 0, longestLoss = 0;
  for (const b of sortedSettled) {
    if (b.status === "push" || b.status === "void") continue;
    if (b.status === curType) curStreak++;
    else { curStreak = 1; curType = b.status; }
    if (curType === "won"  && curStreak > longestWin)  longestWin = curStreak;
    if (curType === "lost" && curStreak > longestLoss) longestLoss = curStreak;
  }

  // CLV moyen (paris avec cote de fermeture capturée)
  const withClv = settled.filter(b => b.clv_pct !== null && b.clv_pct !== undefined);
  const avgClv = withClv.length ? withClv.reduce((s,b)=>s+b.clv_pct, 0) / withClv.length : null;
  const positiveClvRate = withClv.length ? withClv.filter(b => b.clv_pct > 0).length / withClv.length * 100 : null;

  // Today P&L
  const today = todayISO();
  const todaySettled = settled.filter(b => b.settledAt && b.settledAt.slice(0,10) === today);
  const todayProfit = todaySettled.reduce((s,b) => s + profitOf(b), 0);
  const todayLosses = settled.filter(b => b.settledAt && b.settledAt.slice(0,10) === today && b.status === "lost").reduce((s,b)=>s+b.stake, 0);

  // Par sport / book / bucket
  const aggregator = (keyFn) => {
    const out = {};
    for (const b of settled) {
      const k = keyFn(b);
      out[k] = out[k] || { count:0, won:0, stake:0, profit:0 };
      out[k].count++;
      if (b.status === "won") out[k].won++;
      out[k].stake += b.stake;
      out[k].profit += profitOf(b);
    }
    for (const k of Object.keys(out)) {
      out[k].winRate = out[k].count ? out[k].won / out[k].count * 100 : 0;
      out[k].yield   = out[k].stake ? out[k].profit / out[k].stake * 100 : 0;
    }
    return out;
  };
  const bySport = aggregator(b => b.sport);
  const byBook  = aggregator(b => b.book);
  const byBucket = ODD_BUCKETS.map(b => ({ ...b, count:0, won:0, stake:0, profit:0 }));
  for (const b of settled) {
    const bucket = byBucket.find(bu => b.odds > bu.min && b.odds <= bu.max);
    if (!bucket) continue;
    bucket.count++;
    if (b.status === "won") bucket.won++;
    bucket.stake += b.stake;
    bucket.profit += profitOf(b);
  }
  for (const b of byBucket) {
    b.winRate = b.count ? b.won / b.count * 100 : 0;
    b.yield   = b.stake ? b.profit / b.stake * 100 : 0;
  }

  return {
    nb: bets.length, nbPending: bets.length-settled.length, nbSettled: settled.length,
    won, lost, winRate: r2(winRate), yieldPct: r2(yieldPct), roi: r2(roi),
    totalStake: r2(totalStake), totalProfit: r2(totalProfit),
    currentBankroll: r2(currentBankroll), bankrollSeries,
    longestWin, longestLoss, currentStreak: { count: curStreak, type: curType },
    avgClv: avgClv !== null ? r2(avgClv) : null,
    positiveClvRate: positiveClvRate !== null ? r2(positiveClvRate) : null,
    nbWithClv: withClv.length,
    todayProfit: r2(todayProfit), todayLosses: r2(todayLosses), todayCount: todaySettled.length,
    bySport, byBook, byBucket,
  };
}

/* ====== ALERTES ====== */
async function sendNtfy(opp) {
  try {
    const oddsTxt = Object.entries(opp.best_odds)
      .map(([k,v]) => `${k}: ${v} (${opp.books[k]})`).join("\n");
    await fetch("https://ntfy.sh", {
      method: "POST",
      body: JSON.stringify({
        topic: state.ntfyTopic,
        title: `${opp.sport_emoji} +${opp.arb_pct}% — ${opp.sport} (conf ${opp.confidence}/10)`,
        message: `${opp.event}\n${opp.market_label}\n\n${oddsTxt}\n\nDébut : ${new Date(opp.start_time).toLocaleString("fr-FR")}`,
        priority: opp.arb_pct >= state.urgentArb ? 5 : 4,
        tags: opp.arb_pct >= state.urgentArb ? ["rotating_light","moneybag","fire"] : ["moneybag","chart_with_upwards_trend"],
      }),
    });
  } catch(e) { console.error("[ntfy]", e); }
}

let audioCtx = null;
function playBeep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const beep = (freq, when, dur=0.2) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime + when);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + dur);
      osc.start(audioCtx.currentTime + when);
      osc.stop(audioCtx.currentTime + when + dur);
    };
    beep(880, 0); beep(1320, 0.18); beep(1760, 0.36);
  } catch(e) {}
}

function desktopNotify(opp) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  new Notification(`${opp.sport_emoji} Arb +${opp.arb_pct}% — ${opp.sport}`, {
    body: `${opp.event}\nConf ${opp.confidence}/10 · Début : ${new Date(opp.start_time).toLocaleString("fr-FR")}`,
    tag: opp.id,
  });
}

function checkAlerts(opps) {
  const fresh = [];
  for (const opp of opps) {
    const lastArb = state.notified[opp.id] ?? -999;
    if (opp.arb_pct > lastArb + 0.3) {
      // v3 : notif uniquement si confiance suffisante
      if (opp.arb_pct >= state.notifyArb && opp.confidence >= state.notifyConfidence) {
        if (state.alertsEnabled && state.ntfyTopic) sendNtfy(opp);
        if (state.soundEnabled) playBeep();
        if (state.desktopNotif) desktopNotify(opp);
      }
      state.history.unshift({ ...opp, detected_at: Date.now() });
      state.notified[opp.id] = opp.arb_pct;
      fresh.push(opp.id);
      const today = todayISO();
      if (state.bestArbDate !== today) { state.bestArbDate = today; state.bestArbToday = 0; }
      if (opp.arb_pct > state.bestArbToday) state.bestArbToday = opp.arb_pct;
    }
  }
  state.history = state.history.slice(0, 200);
  state.flashIds = new Set(fresh);
  // Cleanup robuste
  const cutoff = Date.now() - 7*24*3600*1000;
  for (const id of Object.keys(state.notified)) {
    const parts = id.split("|");
    const isoCandidate = parts[parts.length-1];
    const ts = Date.parse(isoCandidate);
    if (Number.isFinite(ts) && ts < cutoff) delete state.notified[id];
  }
  save("arb_notified", state.notified);
  save("arb_history", state.history);
  save("arb_best_today", state.bestArbToday);
  save("arb_best_date", state.bestArbDate);
}

function exportBetsCSV() {
  if (!state.bets.length) { alert("Aucun pari."); return; }
  const headers = ["date","status","sport","event","market","selection","book","odds_at_bet","closing_odds","clv_pct","stake","payout","profit","confidence","type","note"];
  const rows = state.bets.map(b => [
    b.date, b.status, b.sport, b.event, b.market, b.selection, b.book,
    b.odds_at_bet||b.odds, b.closing_odds||"", b.clv_pct??"", b.stake, b.payout??"", profitOf(b), b.confidence||"", b.type, b.note,
  ]);
  downloadFile([headers.join(","), ...rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(","))].join("\n"),
    `bets-${todayISO()}.csv`, "text/csv");
}

function exportJSON() {
  const snap = {
    exported_at: new Date().toISOString(),
    bankroll: state.bankroll, bets: state.bets, history: state.history,
    snapshot: state.data, valueBets: state.valueBets,
  };
  downloadFile(JSON.stringify(snap, null, 2), `arbitrage-full-${Date.now()}.json`, "application/json");
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function renderCard(opp, kind) {
  const {stakes, profit, roi} = calculateStakes(opp.best_odds, state.stake);
  const isFresh = state.flashIds.has(opp.id);
  const arbColor = opp.arb_pct >= 5 ? "text-emerald-300" : opp.arb_pct >= 2 ? "text-emerald-400" : "text-amber-400";
  const cols = Object.keys(opp.best_odds).length>2?'3':'2';
  const isValue = kind === "value";
  const confClass = opp.confidence >= 7 ? "conf-high" : opp.confidence >= 4 ? "conf-mid" : "conf-low";
  const confTooltip = `Score confiance basé sur : ${opp.book_count}/4 books, variance ligne ${opp.market==='totals'?'O/U':'cote'}, temps avant match, magnitude edge`;

  // Variance des lignes O/U pour affichage
  const lineVariance = opp.market === "totals" && opp.line_consensus
    ? Object.values(opp.line_consensus).map(c => c.variance).filter(v => v > 0)
    : [];
  const maxLineVar = lineVariance.length ? Math.max(...lineVariance) : 0;

  // Recherche match
  const researchUrl = RESEARCH_LINKS[opp.sport_research]?.(opp.event) || "";

  return `
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 hover:border-emerald-700 transition ${isFresh?'new-opp border-emerald-500':''}">
      <div class="flex justify-between items-start mb-3 gap-3">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 mb-1 flex-wrap">
            <span class="bg-slate-800 text-emerald-400 text-xs px-2 py-0.5 rounded">${opp.sport_emoji||""} ${escapeHtml(opp.sport)}</span>
            <span class="bg-slate-800 text-cyan-400 text-xs px-2 py-0.5 rounded">${escapeHtml(opp.market_label||opp.market||"h2h")}</span>
            <span title="${confTooltip}" class="${confClass} text-white text-xs px-2 py-0.5 rounded font-semibold">conf ${opp.confidence}/10</span>
            <span class="text-xs text-slate-500">${new Date(opp.start_time).toLocaleString("fr-FR")}</span>
            <span class="text-xs px-1.5 py-0.5 rounded ${opp.start_time<new Date().toISOString()?'bg-red-900/50 text-red-300':'bg-slate-800 text-slate-400'}">${timeUntil(opp.start_time)}</span>
            <span class="text-xs text-slate-500">${opp.book_count}/4 books</span>
            ${opp.market === "totals" && maxLineVar > 1.5 ? `<span class="text-xs text-amber-400" title="Lignes très différentes entre books — méfiance">⚠ ligne ±${maxLineVar}</span>` : ""}
            ${researchUrl ? `<a href="${escapeAttr(researchUrl)}" target="_blank" rel="noopener" class="text-xs text-cyan-400 hover:underline">🔍 recherche</a>` : ""}
          </div>
          <h3 class="font-semibold text-lg truncate">${escapeHtml(opp.event)}</h3>
        </div>
        <div class="text-right shrink-0">
          ${isValue
            ? `<div class="text-3xl font-bold text-cyan-400">+${opp.max_edge}%</div>
               <div class="text-xs text-slate-500">edge value</div>`
            : `<div class="text-3xl font-bold ${arbColor}">+${opp.arb_pct}%</div>
               <div class="text-xs text-slate-500">score ${opp.value_score}</div>`}
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-${cols} gap-3 text-sm">
        ${Object.entries(opp.best_odds).map(([k,v]) => {
          const fair = opp.fair_odds?.[k];
          const edge = opp.edges?.[k];
          const kelly = fair && isValue ? kellyStake(v, fair, state.bankroll, state.kellyFraction) : 0;
          const lineInfo = opp.line_consensus?.[k.split(" ").slice(0,-1).join(" ")] || opp.line_consensus?.[k.split(" ")[0]];
          return `
            <div class="bg-slate-800 rounded p-3 transition group">
              <div class="flex justify-between items-start gap-2">
                <div class="min-w-0 flex-1">
                  <div class="font-medium truncate">${escapeHtml(k)}</div>
                  <div class="text-xs text-slate-400 mt-1 flex items-center gap-2 flex-wrap">
                    <a href="${BOOK_URLS[opp.book_keys[k]]||'#'}" target="_blank" rel="noopener"
                       class="px-1.5 py-0.5 rounded text-[10px] ${BOOK_COLORS[opp.book_keys[k]]||'bg-slate-700'} hover:underline">
                      ${escapeHtml(opp.books[k])} ↗
                    </a>
                    ${isValue
                      ? `<span title="Cote équitable estimée">fair ${fair?.toFixed(2)}</span>
                         ${edge>0?`<span class="text-cyan-400 font-semibold">+${edge}% edge</span>`:""}`
                      : `<span>mise <strong>${stakes[k]} €</strong></span>`}
                    ${lineInfo && opp.market==="totals" ? `<span class="text-[10px] text-slate-500" title="Min-max-moy ligne O/U entre books">L:${lineInfo.min}-${lineInfo.max} (moy ${lineInfo.avg})</span>` : ""}
                  </div>
                  ${isValue && kelly>0
                    ? `<div class="text-xs text-amber-400 mt-1">Kelly 1/4 : <strong>${kelly} €</strong></div>`
                    : ""}
                </div>
                <div class="text-2xl font-bold ml-2">${v}</div>
              </div>
              <button class="quick-bet mt-2 w-full text-xs bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 py-1 rounded"
                data-opp='${escapeAttr(JSON.stringify({
                  sport: opp.sport, event: opp.event, market: opp.market,
                  selection: k, book: opp.books[k], odds: v,
                  stake: isValue && kelly>0 ? kelly : stakes[k],
                  type: isValue ? "value" : "arb",
                  confidence: opp.confidence,
                  opportunity_id: opp.id,
                  sport_key: opp.sport_key,
                  event_start: opp.start_time,
                }))}'>
                + Ajouter au tracker
              </button>
            </div>
          `;

function renderBankrollChart() {
  const s = computeStats();
  if (s.bankrollSeries.length <= 1) return;
  const canvas = document.getElementById("bankrollChart");
  if (!canvas) return;
  if (state.bankrollChart) state.bankrollChart.destroy();
  const labels = s.bankrollSeries.map((p,i) => i===0?"Départ":new Date(p.x).toLocaleDateString("fr-FR",{month:"short",day:"numeric"}));
  const data   = s.bankrollSeries.map(p => p.y);
  state.bankrollChart = new Chart(canvas, {
    type: "line",
    data: { labels, datasets: [{
      label: "Bankroll (€)", data,
      borderColor: "#10b981", backgroundColor: "rgba(16,185,129,0.15)",
      tension: 0.25, fill: true, pointRadius: 3, pointHoverRadius: 6,
    }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: "#cbd5e1" } }, tooltip: { mode: "index", intersect: false } },
      scales: {
        x: { ticks: { color: "#64748b", maxRotation:0, autoSkip:true, maxTicksLimit:10 }, grid: { color: "#1e293b" } },
        y: { ticks: { color: "#64748b" }, grid: { color: "#1e293b" } },
      },
    },
  });
}

        <label>
          <span class="text-xs text-slate-400 mb-1 block">Cache cotes (ms)</span>
          <input id="cacheMs" type="number" min="0" max="600000" value="${state.cacheMs}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Pause si quota &lt;</span>
          <input id="apiPauseAt" type="number" min="0" value="${state.apiPauseAt}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Fenêtre scan (min, 0=∞)</span>
          <input id="scanWindowMin" type="number" min="0" value="${state.scanWindowMin}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" title="Ne scanner que les events qui commencent dans X minutes (0 = pas de limite)" />
        </label>
      </div>
      ${state.adaptiveReasons?.length ? `
        <p class="text-xs text-slate-500 mt-3">Multiplicateur actuel ×${state.lastRefreshFactor.toFixed(1)} → ${state.adaptiveReasons.join(" + ")}</p>
      ` : `<p class="text-xs text-slate-500 mt-3">L'adaptive refresh ralentit le scan automatiquement la nuit, quand le quota baisse, quand rien n'est trouvé, ou quand l'onglet est en arrière-plan. Économie typique : 60–85% du quota.</p>`}
    </section>

    <!-- MONEY MANAGEMENT -->
    <section class="bg-slate-900 rounded-lg p-4 mb-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">🛡️ Money management (anti-tilt)</h2>
      <label class="flex items-center gap-2 text-sm mb-3"><input id="mmEnabled" type="checkbox" ${state.mmEnabled?"checked":""} /><span>Activer les protections (recommandé)</span></label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Mise max (% bankroll)</span>
          <input id="maxBetPct" type="number" step="0.5" min="0.1" max="100" value="${state.maxBetPct}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Stop-loss journalier (%)</span>
          <input id="dailyLossLimitPct" type="number" step="1" min="1" max="100" value="${state.dailyLossLimitPct}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Cooldown après N défaites</span>
          <input id="cooldownLosses" type="number" min="2" max="20" value="${state.cooldownLosses}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Durée cooldown (min)</span>
          <input id="cooldownMin" type="number" min="5" max="1440" value="${state.cooldownMin}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
      </div>
      ${state.pausedUntil > Date.now() ? `<button id="forceResume" class="mt-3 text-xs text-amber-400 hover:text-amber-300">Forcer reprise (déconseillé)</button>` : ""}
    </section>

    <!-- VALUE BETTING -->
    <section class="bg-slate-900 rounded-lg p-4 mb-4">
      <h2 class="text-sm font-semibold text-slate-300 mb-3">💎 Value betting</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Edge minimum (%)</span>
          <input id="valueEdge" type="number" step="0.5" min="0" value="${state.valueEdge}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" />
        </label>
        <label>
          <span class="text-xs text-slate-400 mb-1 block">Fraction Kelly</span>
          <input id="kellyFraction" type="number" step="0.05" min="0" max="1" value="${state.kellyFraction}" class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-sm" title="0.25 = Kelly fractionné 1/4 (prudent). 1 = full Kelly (volatile)" />
        </label>
        <label class="col-span-2">
          <span class="text-xs text-slate-400 mb-1 block">Tracking CLV (Closing Line Value)</span>
          <label class="flex items-center gap-2"><input id="clvEnabled" type="checkbox" ${state.clvEnabled?"checked":""} /><span>Capturer auto la cote de fermeture (consomme +1 req/pari, ~30 min avant kickoff)</span></label>
        </label>
      </div>
    </section>

    <!-- INFOS -->
    <section class="bg-slate-900 rounded-lg p-4 mb-4 text-xs text-slate-400">
      <h2 class="text-sm font-semibold text-slate-300 mb-2">ℹ Conseils d'utilisation</h2>
      <ul class="space-y-1 list-disc list-inside">
        <li>Pour économiser le quota : Adaptive refresh ON + base 60s + sports limités à NBA + Ligue 1</li>
        <li>Pour les notifications : seuil arb 2.5% + confiance 6/10 minimum (filtre le bruit)</li>
        <li>Pour le money management : 5% mise max + 10% stop-loss journalier sont des standards prudents</li>
        <li>Le CLV se calcule automatiquement quand un match commence — checke tes stats après quelques semaines</li>
        <li>📱 Sur iPhone : <strong>Safari → Partager → Sur l'écran d'accueil</strong> pour avoir l'app comme une vraie appli</li>
      </ul>
    </section>
  `;
}

/* ====== ÉVÉNEMENTS ====== */
function attachListeners() {
  const $ = id => document.getElementById(id);

  document.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => {
      state.tab = b.dataset.tab;
      save("arb_tab", state.tab);
      render();
    });
  });
  document.querySelectorAll(".goto-tab").forEach(a => {
    a.addEventListener("click", e => { e.preventDefault(); state.tab = a.dataset.tab; save("arb_tab", state.tab); render(); });
  });

  if (state.tab === "scanner")  attachScannerListeners();
  if (state.tab === "tracker")  attachTrackerListeners();
  if (state.tab === "settings") attachSettingsListeners();
}

function attachScannerListeners() {
  const $ = id => document.getElementById(id);

  $("apiKey")?.addEventListener("input", e => {
    const wasEmpty = !state.apiKey;
    state.apiKey = e.target.value.trim(); save("arb_apikey", state.apiKey);
    if (state.apiKey && wasEmpty) startTimer();
  });
  $("stake")?.addEventListener("input", e => { state.stake = Number(e.target.value)||0; save("arb_stake", state.stake); render(); });
  $("minArb")?.addEventListener("change", e => { state.minArb = Number(e.target.value); MIN_ARB_PCT = state.minArb; save("arb_min", state.minArb); refresh(); });
  $("minConfidence")?.addEventListener("change", e => { state.minConfidence = Number(e.target.value); save("arb_min_conf", state.minConfidence); refresh(); });
  $("sortBy")?.addEventListener("change", e => { state.sortBy = e.target.value; save("arb_sort", state.sortBy); refresh(); });
  $("refresh")?.addEventListener("click", refresh);

  document.querySelectorAll(".sport-toggle").forEach(cb => cb.addEventListener("change", e => {
    state.enabledSports[e.target.dataset.sport] = e.target.checked; save("arb_sports", state.enabledSports); refresh();
  }));
  $("sportsAll")?.addEventListener("click", () => { SPORTS.forEach(s => state.enabledSports[s.key] = true); save("arb_sports", state.enabledSports); refresh(); });
  $("sportsNone")?.addEventListener("click", () => { SPORTS.forEach(s => state.enabledSports[s.key] = false); save("arb_sports", state.enabledSports); refresh(); });
  $("sportsKey")?.addEventListener("click", () => {
    const w = ["basketball_nba","soccer_france_ligue_one","soccer_uefa_champs_league","soccer_epl","soccer_spain_la_liga","soccer_italy_serie_a","tennis_atp"];
    SPORTS.forEach(s => state.enabledSports[s.key] = w.includes(s.key)); save("arb_sports", state.enabledSports); refresh();
  });
  $("sportsEss")?.addEventListener("click", () => {
    const w = ["basketball_nba","soccer_france_ligue_one"];
    SPORTS.forEach(s => state.enabledSports[s.key] = w.includes(s.key)); save("arb_sports", state.enabledSports); refresh();
  });

  // Activation/désactivation par catégorie
  document.querySelectorAll(".cat-all").forEach(b => b.addEventListener("click", e => {
    e.preventDefault();
    const cat = b.dataset.cat;
    SPORTS.filter(s => s.cat === cat).forEach(s => state.enabledSports[s.key] = true);
    save("arb_sports", state.enabledSports); refresh();
  }));
  document.querySelectorAll(".cat-none").forEach(b => b.addEventListener("click", e => {
    e.preventDefault();
    const cat = b.dataset.cat;
    SPORTS.filter(s => s.cat === cat).forEach(s => state.enabledSports[s.key] = false);
    save("arb_sports", state.enabledSports); refresh();
  }));

  $("exportJson")?.addEventListener("click", exportJSON);
  $("exportCsv")?.addEventListener("click", exportCSV);

  // v3.1 — Filtres marché et cote
  $("marketFilter")?.addEventListener("change", e => { state.marketFilter = e.target.value; save("arb_market_filter", state.marketFilter); refresh(); });
  $("minOdds")?.addEventListener("change", e => { state.minOdds = Number(e.target.value)||1; save("arb_min_odds", state.minOdds); refresh(); });
  $("maxOdds")?.addEventListener("change", e => { state.maxOdds = Number(e.target.value)||50; save("arb_max_odds", state.maxOdds); refresh(); });
  $("showArbs")?.addEventListener("change", e => { state.showArbs = e.target.checked; save("arb_show_arbs", state.showArbs); refresh(); });
  $("showValueBets")?.addEventListener("change", e => { state.showValueBets = e.target.checked; save("arb_show_values", state.showValueBets); refresh(); });
  $("resetFilters")?.addEventListener("click", () => {
    state.marketFilter = "all"; state.minOdds = 1.0; state.maxOdds = 50.0;
    state.showArbs = true; state.showValueBets = true;
    save("arb_market_filter", "all"); save("arb_min_odds", 1.0); save("arb_max_odds", 50.0);
    save("arb_show_arbs", true); save("arb_show_values", true);
    refresh();
  });

  // Presets de filtres
  document.querySelectorAll(".preset-btn").forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.preset;
    if (p === "safe")     { state.minOdds = 1.4; state.maxOdds = 2.5; state.marketFilter = "all"; state.showArbs = true; state.showValueBets = true; }
    if (p === "balanced") { state.minOdds = 1.7; state.maxOdds = 3.0; state.marketFilter = "all"; state.showArbs = true; state.showValueBets = true; }
    if (p === "ou")       { state.minOdds = 1.0; state.maxOdds = 50.0; state.marketFilter = "totals"; state.showArbs = true; state.showValueBets = true; }
    if (p === "all")      { state.minOdds = 1.0; state.maxOdds = 50.0; state.marketFilter = "all"; state.showArbs = true; state.showValueBets = true; }
    save("arb_market_filter", state.marketFilter);
    save("arb_min_odds", state.minOdds);
    save("arb_max_odds", state.maxOdds);
    save("arb_show_arbs", state.showArbs);
    save("arb_show_values", state.showValueBets);
    refresh();
  }));

  document.querySelectorAll(".hide-btn").forEach(b => b.addEventListener("click", () => {
    state.hidden[b.dataset.hide] = true; save("arb_hidden", state.hidden); refresh();
  }));

  document.querySelectorAll(".quick-bet").forEach(b => b.addEventListener("click", () => {
    try {
      const data = JSON.parse(b.dataset.opp);
      const opp = { id: data.opportunity_id, confidence: data.confidence };
      const bet = addBet(data, opp);
      if (bet) {
        // attache les infos pour CLV
        bet.sport_key = data.sport_key;
        bet.event_start = data.event_start;
        save("arb_bets", state.bets);
        b.textContent = "✓ Ajouté"; b.classList.add("opacity-60"); b.disabled = true;
      }
    } catch(e) { console.error(e); alert("Erreur ajout pari : " + e.message); }
  }));

  $("clearHistory")?.addEventListener("click", () => {
    if (!confirm("Effacer tout l'historique ?")) return;
    state.history = []; save("arb_history", []); render();
  });
}

function attachTrackerListeners() {
  const $ = id => document.getElementById(id);
  $("bankroll")?.addEventListener("change", e => { state.bankroll = Number(e.target.value)||0; save("arb_bankroll", state.bankroll); render(); });
  $("addBetForm")?.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(e.target); const obj = {}; fd.forEach((v,k) => obj[k] = v);
    const bet = addBet(obj);
    if (bet) render();
  });
  document.querySelectorAll(".settle-btn").forEach(b => b.addEventListener("click", () => { settleBet(b.dataset.settle, b.dataset.status); render(); }));
  document.querySelectorAll(".del-btn").forEach(b => b.addEventListener("click", () => { if (confirm("Supprimer ?")) { deleteBet(b.dataset.delete); render(); } }));
  $("exportBetsCsv")?.addEventListener("click", exportBetsCSV);
}

function attachSettingsListeners() {
  const $ = id => document.getElementById(id);
  const numHandler = (id, key, save_key) => $(id)?.addEventListener("change", e => { state[key] = Number(e.target.value); save(save_key, state[key]); });
  const boolHandler = (id, key, save_key) => $(id)?.addEventListener("change", e => { state[key] = e.target.checked; save(save_key, state[key]); });

  numHandler("notifyArb",         "notifyArb",         "arb_notify");
  numHandler("urgentArb",         "urgentArb",         "arb_urgent");
  numHandler("notifyConfidence",  "notifyConfidence",  "arb_notify_conf");
  numHandler("refreshSec",        "refreshSec",        "arb_refresh");
  numHandler("cacheMs",           "cacheMs",           "arb_cache_ms");
  numHandler("apiPauseAt",        "apiPauseAt",        "arb_api_pause");
  numHandler("scanWindowMin",     "scanWindowMin",     "arb_scan_window");
  numHandler("maxBetPct",         "maxBetPct",         "arb_max_bet_pct");
  numHandler("dailyLossLimitPct", "dailyLossLimitPct", "arb_daily_loss");
  numHandler("cooldownLosses",    "cooldownLosses",    "arb_cooldown");
  numHandler("cooldownMin",       "cooldownMin",       "arb_cooldown_min");
  numHandler("valueEdge",         "valueEdge",         "arb_value_edge");
  numHandler("kellyFraction",     "kellyFraction",     "arb_kelly_fr");

  boolHandler("alerts",          "alertsEnabled", "arb_alerts");
  boolHandler("sound",           "soundEnabled",  "arb_sound");
  boolHandler("adaptiveRefresh", "adaptiveRefresh","arb_adaptive");
  boolHandler("mmEnabled",       "mmEnabled",     "arb_mm_on");
  boolHandler("clvEnabled",      "clvEnabled",    "arb_clv_on");

  $("ntfy")?.addEventListener("input", e => { state.ntfyTopic = e.target.value.trim(); save("arb_ntfy", state.ntfyTopic); });
  $("desktop")?.addEventListener("change", async e => {
    if (e.target.checked && "Notification" in window) {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { e.target.checked = false; alert("Notifications bloquées."); return; }
    }
    state.desktopNotif = e.target.checked; save("arb_desktop", state.desktopNotif);
  });
  $("testAlert")?.addEventListener("click", async () => {
    if (!state.ntfyTopic) return;
    await fetch("https://ntfy.sh", {
      method: "POST",
      body: JSON.stringify({ topic: state.ntfyTopic, title: "✅ Test v3", message: "OK 🎯", priority: 4, tags:["white_check_mark"] }),
    });
    alert("Notification envoyée !");
  });
  $("resetNotified")?.addEventListener("click", () => {
    if (!confirm("Reset historique alertes ?")) return;
    state.notified = {}; localStorage.removeItem("arb_notified"); alert("OK.");
  });
  $("forceResume")?.addEventListener("click", () => {
    if (!confirm("Forcer la fin du cooldown ? (déconseillé après une mauvaise série)")) return;
    state.pausedUntil = 0; save("arb_paused_until", 0); render();
  });
}

/* ====== BOUCLE PRINCIPALE ====== */
async function refresh() {
  if (!state.apiKey) return;
  if (state.scanLock) { console.warn("[arb] scan déjà en cours"); return; }
  state.scanLock = true;
  state.loading = true; state.error = null; render();
  try {
    const result = await getTopOpportunities(state.apiKey);
    state.data = result.arbs;
    state.valueBets = result.values;
    state.lastUpdate = new Date();
    state.scanCount++;
    save("arb_scan_count", state.scanCount);
    checkAlerts(state.data);
    // CLV capture en arrière-plan
    if (state.clvEnabled) captureClosingOdds().catch(e => console.warn("[CLV bg]", e));
    // Adaptive : suivi des scans vides
    if (result.arbs.length === 0 && result.values.length === 0) state.recentEmptyScans++;
    else state.recentEmptyScans = 0;
  } catch(e) {
    console.error("[arb]", e);
    state.error = e.message;
  } finally {
    state.loading = false;
    state.scanLock = false;
    state.nextRefreshSec = computeAdaptiveDelay();
    state.countdown = state.nextRefreshSec;
    render();
    rescheduleTimer();
  }
}

function rescheduleTimer() {
  if (timer) clearInterval(timer);
  if (countdownTimer) clearInterval(countdownTimer);
  if (!state.apiKey) return;
  timer = setInterval(refresh, state.nextRefreshSec * 1000);
  countdownTimer = setInterval(() => {
    state.countdown = Math.max(0, state.countdown - 1);
    const el = document.getElementById("countdown");
    if (el) el.textContent = state.countdown + "s";
  }, 1000);
}

function startTimer() {
  if (timer) clearInterval(timer);
  if (countdownTimer) clearInterval(countdownTimer);
  if (!state.apiKey) return;
  state.nextRefreshSec = computeAdaptiveDelay();
  refresh();
}

// Détection visibilité onglet (recalcule l'adaptive)
if (typeof document !== "undefined") {
  document.addEventListener("visibilitychange", () => {
    if (state.apiKey && state.tab === "scanner") {
      state.nextRefreshSec = computeAdaptiveDelay();
      rescheduleTimer();
    }
  });
}

/* ====== INIT ====== */
render();
if (state.apiKey && state.tab === "scanner") startTimer();
</script>
